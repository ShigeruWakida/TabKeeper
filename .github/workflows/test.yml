name: Test TabKeeper

on:
  push:
    branches: [main]
    paths:
      - 'session.js'
      - 'popup.js'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'session.js'
      - 'popup.js'
      - 'tests/**'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check session.js
          node --check popup.js
      - name: Test session utilities
        run: node --test tests/session.test.cjs
