<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabKeeper</title><link rel="stylesheet" href="popup.css"></head><body><main>
<h1>TabKeeper</h1><p>現在のChromeウィンドウのタブを保存・復元します。</p>
<section><h2>保存</h2><p id="folder-label" class="folder">保存先フォルダー: 読み込み中…</p>
<button id="choose-folder" type="button" class="secondary">保存先フォルダーを選択・変更</button>
<button id="save" type="button" disabled>現在のタブをJSONに保存</button>
<p class="note">フォルダーを記憶します。権限が失効した場合は再許可が必要です。</p></section>
<section><h2>復元</h2><input id="file" type="file" accept=".json,application/json" aria-label="保存済みJSONを選択">
<p id="preview" hidden></p><button id="restore" type="button" disabled>新しいウィンドウに復元</button>
<p class="note">既存のタブは削除しません。</p></section>
<p id="status" role="status" aria-live="polite"></p></main>
<script src="session.js"></script><script src="popup.js"></script></body></html>
